<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sparky's TVPS-4 Adventure Hub — All 7 Visual Perception Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg1: #eef2ff;
      --bg2: #fdf4ff;
      --bg3: #ecfeff;
      --ink: #1e1b4b;
      --muted: #475569;
      --card: #ffffff;
      --border: #c7d2fe;
      --shadow: 0 10px 28px rgba(67, 56, 202, 0.11);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: linear-gradient(145deg, var(--bg1) 0%, var(--bg2) 52%, var(--bg3) 100%);
      overflow: hidden;
    }

    /* HUB HOME VIEW */
    .hub-view {
      height: 100vh;
      height: 100dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 14px 16px calc(22px + env(safe-area-inset-bottom, 0px));
    }
    .hub-view.hidden { display: none; }

    .hub-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* HERO HEADER */
    .hub-header {
      background: #ffffff;
      border: 2.5px solid #c7d2fe;
      border-radius: 22px;
      padding: 14px 18px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .hero-left {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .sparky-badge {
      width: 60px;
      height: 60px;
      border-radius: 18px;
      background: linear-gradient(135deg, #eef2ff, #e0e7ff);
      border: 2.5px solid #a5b4fc;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      cursor: pointer;
      transition: transform 0.14s ease;
    }
    .sparky-badge:hover { transform: scale(1.05); }

    .hero-title h1 {
      font-family: 'Fredoka', 'Inter', sans-serif;
      font-size: 1.4rem;
      line-height: 1.15;
      color: #1e1b4b;
    }
    .hero-title p {
      font-size: 0.84rem;
      font-weight: 600;
      color: #4f46e5;
      margin-top: 2px;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .progress-pill {
      background: #ecfdf5;
      border: 2px solid #6ee7b7;
      color: #065f46;
      font-weight: 800;
      font-size: 0.8rem;
      padding: 7px 12px;
      border-radius: 14px;
      white-space: nowrap;
    }

    .coin-btn {
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      border: 2px solid #f59e0b;
      color: #92400e;
      font-weight: 800;
      font-size: 0.86rem;
      padding: 7px 14px;
      border-radius: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 3px 0 #f59e0b;
      transition: transform 0.12s ease;
    }
    .coin-btn:hover { transform: translateY(-1px); }
    .coin-btn:active { transform: translateY(1px); }

    /* GAME CARDS GRID */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 13px;
    }

    .game-card {
      background: #ffffff;
      border: 2.5px solid var(--card-border, #c7d2fe);
      border-radius: 22px;
      padding: 15px 16px;
      box-shadow: 0 8px 20px rgba(30, 27, 75, 0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 11px;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease;
      position: relative;
      overflow: hidden;
    }
    .game-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 28px rgba(30, 27, 75, 0.14);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .card-icon {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      display: grid;
      place-items: center;
      font-size: 26px;
      flex-shrink: 0;
    }

    .card-meta {
      min-width: 0;
      flex: 1;
    }

    .subtest-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.69rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--card-accent);
      margin-bottom: 2px;
    }

    .card-title {
      font-family: 'Fredoka', 'Inter', sans-serif;
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.15;
    }

    .card-desc {
      font-size: 0.81rem;
      color: var(--muted);
      line-height: 1.38;
      font-weight: 500;
    }

    .card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 2px;
    }

    .style-chip {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
      background: var(--card-bg);
      color: var(--card-accent);
      border: 1.5px solid var(--card-border);
    }

    .played-dot {
      display: none;
      font-size: 0.72rem;
      font-weight: 800;
      color: #059669;
    }
    .game-card.played .played-dot { display: inline; }

    .play-btn {
      border: none;
      background: var(--card-accent);
      color: #ffffff;
      font-family: 'Fredoka', 'Inter', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 7px 15px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.18);
      white-space: nowrap;
    }

    /* ACTIVE GAME VIEW */
    .player-view {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      background: #eef2ff;
    }
    .player-view.hidden { display: none; }

    .hub-bar {
      height: 42px;
      flex-shrink: 0;
      background: #1e1b4b;
      color: #ffffff;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.25);
      z-index: 10;
    }

    .bar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .back-btn {
      border: 1.5px solid rgba(199, 210, 254, 0.5);
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-weight: 800;
      font-size: 0.78rem;
      padding: 5px 11px;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
    }
    .back-btn:hover { background: rgba(255, 255, 255, 0.22); }

    .game-select {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      border: 1.5px solid rgba(199, 210, 254, 0.45);
      border-radius: 10px;
      padding: 4px 8px;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 0.78rem;
      max-width: 240px;
      cursor: pointer;
    }
    .game-select option { color: #1e1b4b; background: #ffffff; }

    .bar-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bar-coin {
      background: rgba(251, 191, 36, 0.2);
      border: 1.5px solid #fbbf24;
      color: #fde68a;
      font-weight: 800;
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 10px;
      white-space: nowrap;
    }

    #gameFrame {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #ffffff;
    }

    /* HAT SHOP MODAL */
    .shop-wrap {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 40;
    }
    .shop-wrap.hidden { display: none; }

    .shop-card {
      background: #ffffff;
      border: 3px solid #a5b4fc;
      border-radius: 24px;
      padding: 18px 20px;
      max-width: 500px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 22px 50px rgba(15, 23, 42, 0.35);
    }

    .shop-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .shop-head h2 { font-family: 'Fredoka', sans-serif; font-size: 1.25rem; }

    .close-btn {
      border: 2px solid #c7d2fe;
      background: #fff;
      color: var(--ink);
      font-weight: 800;
      font-size: 0.78rem;
      padding: 5px 11px;
      border-radius: 11px;
      cursor: pointer;
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .hat-item {
      border: 2px solid #c7d2fe;
      border-radius: 16px;
      padding: 10px;
      background: #f8faff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-align: center;
    }
    .hat-item.equipped { border-color: #10b981; background: #ecfdf5; }
    .hat-name { font-weight: 800; font-size: 0.82rem; }
    .hat-desc { font-size: 0.7rem; color: #64748b; }
    .hat-btn {
      margin-top: 3px;
      border: none;
      border-radius: 10px;
      padding: 5px 12px;
      font-size: 0.74rem;
      font-weight: 800;
      cursor: pointer;
      background: #6366f1;
      color: #fff;
    }
    .hat-btn.owned { background: #10b981; }
    .hat-btn.equipped-btn { background: #0f766e; cursor: default; }
    .hat-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    @media (max-width: 640px) {
      .hub-view { padding: 10px 10px calc(18px + env(safe-area-inset-bottom, 0px)); }
      .hub-header { padding: 12px; gap: 10px; border-radius: 18px; }
      .sparky-badge { width: 50px; height: 50px; border-radius: 14px; }
      .hero-title h1 { font-size: 1.15rem; }
      .hero-title p { font-size: 0.76rem; }
      .hero-actions { width: 100%; justify-content: space-between; }
      .games-grid { grid-template-columns: 1fr; gap: 10px; }
      .game-card { padding: 13px 14px; border-radius: 18px; }
      .game-select { max-width: 175px; font-size: 0.74rem; }
    }
  </style>
</head>

      const SHOP_ITEMS = [
        { id: 'none', name: 'Classic Sparky', price: 0, desc: 'Original adventure antenna.' },
        { id: 'crown', name: 'Golden Crown', price: 40, desc: 'Royal crown for perception pros!' },
        { id: 'wizard', name: 'Star Wizard Hat', price: 60, desc: 'Magic galaxy wizard hat.' },
        { id: 'cat', name: 'Neko Ears', price: 50, desc: 'Playful pink robot cat ears.' },
        { id: 'helmet', name: 'Astro Dome', price: 80, desc: 'Crystal explorer helmet!' },
        { id: 'shades', name: 'Turbo Shades', price: 70, desc: 'Cool glowing shades.' }
      ];

      const state = {
        coins: 0,
        ownedHats: ['none'],
        equippedHat: 'none',
        played: [],
        activeId: null
      };

      const hubView = document.getElementById('hubView');
      const playerView = document.getElementById('playerView');
      const hubSparky = document.getElementById('hubSparky');
      const hubCoins = document.getElementById('hubCoins');
      const barCoins = document.getElementById('barCoins');
      const playedCount = document.getElementById('playedCount');
      const gamesGrid = document.getElementById('gamesGrid');
      const gameSelect = document.getElementById('gameSelect');
      const gameFrame = document.getElementById('gameFrame');
      const backHubBtn = document.getElementById('backHubBtn');
      const hubShopBtn = document.getElementById('hubShopBtn');
      const shopModal = document.getElementById('shopModal');
      const shopGrid = document.getElementById('shopGrid');
      const closeShopBtn = document.getElementById('closeShopBtn');

      function decodeBase64Utf8(b64) {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return new TextDecoder('utf-8').decode(bytes);
      }

      function loadRewards() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const d = JSON.parse(raw);
            if (typeof d.coins === 'number') state.coins = d.coins;
            if (Array.isArray(d.ownedHats)) state.ownedHats = d.ownedHats;
            if (typeof d.equippedHat === 'string') state.equippedHat = d.equippedHat;
          }
        } catch (e) {}
        try {
          const pRaw = localStorage.getItem(HUB_PLAYED_KEY);
          if (pRaw) {
            const p = JSON.parse(pRaw);
            if (Array.isArray(p)) state.played = p;
          }
        } catch (e) {}
      }

      function saveRewards() {
        try {
          const prev = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            ...prev,
            coins: state.coins,
            ownedHats: state.ownedHats,
            equippedHat: state.equippedHat
          }));
        } catch (e) {}
      }

      function savePlayed() {
        try {
          localStorage.setItem(HUB_PLAYED_KEY, JSON.stringify(state.played));
        } catch (e) {}
      }

      function sparkySVG(hatId, size = 48) {
        let hatSvg = '';
        if (hatId === 'crown') {
          hatSvg = '<polygon points="18,22 22,10 30,17 38,8 46,17 54,10 58,22" fill="#fbbf24" stroke="#312e81" stroke-width="2.5" stroke-linejoin="round"/>';
        } else if (hatId === 'wizard') {
          hatSvg = '<path d="M16,24 L38,3 L60,24 Z" fill="#8b5cf6" stroke="#312e81" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="38" cy="24" rx="25" ry="4.5" fill="#a78bfa" stroke="#312e81" stroke-width="2.2"/>';
        } else if (hatId === 'cat') {
          hatSvg = '<polygon points="19,25 23,9 33,21" fill="#f472b6" stroke="#312e81" stroke-width="2.5"/><polygon points="57,25 53,9 43,21" fill="#f472b6" stroke="#312e81" stroke-width="2.5"/>';
        } else if (hatId === 'helmet') {
          hatSvg = '<circle cx="38" cy="42" r="30" fill="rgba(56,189,248,0.2)" stroke="#38bdf8" stroke-width="3"/>';
        } else if (hatId === 'shades') {
          hatSvg = '<rect x="20" y="34" width="15" height="9" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/><rect x="41" y="34" width="15" height="9" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/><line x1="35" y1="38" x2="41" y2="38" stroke="#312e81" stroke-width="2.5"/>';
        } else {
          hatSvg = '<line x1="38" y1="20" x2="38" y2="10" stroke="#312e81" stroke-width="3" stroke-linecap="round"/><circle cx="38" cy="8" r="4" fill="#fbbf24" stroke="#312e81" stroke-width="2"/>';
        }
        return `
          <svg width="${size}" height="${size}" viewBox="0 0 76 76" aria-hidden="true">
            <rect x="16" y="22" width="44" height="38" rx="14" fill="#6366f1" stroke="#312e81" stroke-width="3"/>
            <rect x="22" y="28" width="32" height="24" rx="9" fill="#e0e7ff" stroke="#312e81" stroke-width="2"/>
            <circle cx="30" cy="39" r="3.4" fill="#1e1b4b"/>
            <circle cx="46" cy="39" r="3.4" fill="#1e1b4b"/>
            <circle cx="25" cy="45" r="2.6" fill="#fb7185" opacity="0.7"/>
            <circle cx="51" cy="45" r="2.6" fill="#fb7185" opacity="0.7"/>
            <path d="M33,45 Q38,50 43,45" fill="none" stroke="#1e1b4b" stroke-width="2.4" stroke-linecap="round"/>
            ${hatSvg}
          </svg>
        `;
      }

      function syncUI() {
        loadRewards();
        hubSparky.innerHTML = sparkySVG(state.equippedHat, 48);
        hubCoins.textContent = state.coins;
        barCoins.textContent = `★ ${state.coins}`;
        playedCount.textContent = `🗺️ ${state.played.length} / 7 Played`;
        document.querySelectorAll('.game-card').forEach(el => {
          el.classList.toggle('played', state.played.includes(el.dataset.id));
        });
      }

      function renderCards() {
        gamesGrid.innerHTML = '';
        gameSelect.innerHTML = '';

        GAMES.forEach(g => {
          const opt = document.createElement('option');
          opt.value = g.id;
          opt.textContent = `${g.emoji} ${g.num}. ${g.title} (${g.subtest})`;
          gameSelect.appendChild(opt);

          const card = document.createElement('article');
          card.className = 'game-card' + (state.played.includes(g.id) ? ' played' : '');
          card.dataset.id = g.id;
          card.style.setProperty('--card-accent', g.accent);
          card.style.setProperty('--card-bg', g.bg);
          card.style.setProperty('--card-border', g.border);

          card.innerHTML = `
            <div class="card-top">
              <div class="card-icon">${g.emoji}</div>
              <div class="card-meta">
                <div class="subtest-tag">#${g.num} • ${g.subtest}</div>
                <h2 class="card-title">${g.title}</h2>
              </div>
            </div>
            <p class="card-desc">${g.desc}</p>
            <div class="card-foot">
              <span class="style-chip">${g.style}</span>
              <span class="played-dot">✓ Played</span>
              <button class="play-btn" type="button">Play ▶</button>
            </div>
          `;

          card.addEventListener('click', () => openGame(g.id));
          gamesGrid.appendChild(card);
        });
      }

      function openGame(id) {
        if (!GAME_PAYLOADS[id]) return;
        state.activeId = id;
        if (!state.played.includes(id)) {
          state.played.push(id);
          savePlayed();
        }
        gameSelect.value = id;
        hubView.classList.add('hidden');
        playerView.classList.remove('hidden');
        gameFrame.srcdoc = decodeBase64Utf8(GAME_PAYLOADS[id]);
        syncUI();
      }

      function returnToHub() {
        state.activeId = null;
        gameFrame.srcdoc = '';
        playerView.classList.add('hidden');
        hubView.classList.remove('hidden');
        syncUI();
      }

      function renderShop() {
        loadRewards();
        shopGrid.innerHTML = '';
        SHOP_ITEMS.forEach(item => {
          const owned = state.ownedHats.includes(item.id);
          const equipped = state.equippedHat === item.id;
          const card = document.createElement('div');
          card.className = 'hat-item' + (equipped ? ' equipped' : '');
          const label = equipped ? 'Equipped ✓' : (owned ? 'Wear' : `Buy ★ ${item.price}`);
          const cls = equipped ? 'hat-btn equipped-btn' : (owned ? 'hat-btn owned' : 'hat-btn');
          const disabled = !owned && state.coins < item.price;

          card.innerHTML = `
            <div>${sparkySVG(item.id, 52)}</div>
            <div class="hat-name">${item.name}</div>
            <div class="hat-desc">${item.desc}</div>
            <button class="${cls}" ${disabled ? 'disabled' : ''}>${label}</button>
          `;
          card.querySelector('button').addEventListener('click', () => {
            if (equipped) return;
            if (!owned) {
              if (state.coins < item.price) return;
              state.coins -= item.price;
              state.ownedHats.push(item.id);
            }
            state.equippedHat = item.id;
            saveRewards();
            syncUI();
            renderShop();
          });
          shopGrid.appendChild(card);
        });
      }

      backHubBtn.addEventListener('click', returnToHub);
      gameSelect.addEventListener('change', (e) => openGame(e.target.value));

      hubShopBtn.addEventListener('click', () => {
        renderShop();
        shopModal.classList.remove('hidden');
      });
      hubSparky.addEventListener('click', () => {
        renderShop();
        shopModal.classList.remove('hidden');
      });
      closeShopBtn.addEventListener('click', () => shopModal.classList.add('hidden'));
      shopModal.addEventListener('click', (e) => {
        if (e.target === shopModal) shopModal.classList.add('hidden');
      });

      // Keep coin counter live while playing inside iframe
      setInterval(() => {
        if (state.activeId) syncUI();
      }, 1500);

      // Boot
      loadRewards();
      renderCards();
      syncUI();
    })();
  </script>
</body>
</html>
